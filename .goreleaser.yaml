version: 2

before:
  hooks:
    - go mod download

builds:
  # darwin and windows use purego (no cgo) audio backends.
  - id: elevenlabs-mcp-nocgo
    main: .
    binary: elevenlabs-mcp
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.version={{.Version}}
    goos:
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
  # linux audio backend (oto/ALSA) requires cgo; runner must have libasound2-dev.
  # amd64 only: cgo cross-compilation to arm64 would need an aarch64 toolchain
  # and arm64 ALSA headers on the runner.
  - id: elevenlabs-mcp-linux
    main: .
    binary: elevenlabs-mcp
    env:
      - CGO_ENABLED=1
    ldflags:
      - -s -w -X main.version={{.Version}}
    goos:
      - linux
    goarch:
      - amd64

archives:
  - formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else }}{{ .Arch }}{{ end }}
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "Merge pull request"
      - "Merge branch"

release:
  prerelease: auto
